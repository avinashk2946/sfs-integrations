<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Integrations - Smart Food Safe</title>
<meta name="description" content="How Smart Food Safe connects to IoT temperature devices, external laboratories, Master Data systems, and more.">
<link rel="icon" href="https://cdn.smartfoodsafe.com/platform/favicon.ico" sizes="any">
<script>document.documentElement.classList.add('js');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
  /* ============================= TOKENS ============================= */
  :root{
    --bg:            #F5F6F1;
    --surface:       #FFFFFF;
    --surface-alt:   #ECF0E9;
    --ink:           #16211D;
    --ink-soft:      #4A5A53;
    --ink-faint:     #7C8A82;
    --line:          #D9DFD5;
    --line-strong:   #BFC9BC;
    --teal:          #1F4E4A;
    --teal-deep:     #123330;
    --teal-tint:     #E4EDEB;
    --amber:         #AD7B2B;
    --amber-tint:    #F3E7D2;

    --serif: "IBM Plex Serif", Georgia, serif;
    --sans:  "IBM Plex Sans", -apple-system, Segoe UI, Roboto, sans-serif;
    --mono:  "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

    --radius-s: 4px;
    --radius-m: 8px;
    --content-w: 1140px;
  }

  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  @media (prefers-reduced-motion: reduce){ html{ scroll-behavior:auto; } }

  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    font-size:16px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }

  h1,h2,h3,h4{ font-family:var(--serif); font-weight:600; color:var(--ink); margin:0; letter-spacing:-0.01em; }
  p{ margin:0; }
  a{ color:inherit; }
  ul{ margin:0; padding:0; list-style:none; }

  ::selection{ background:var(--teal); color:#fff; }

  :focus-visible{
    outline:2px solid var(--teal);
    outline-offset:3px;
  }

  .wrap{
    max-width:var(--content-w);
    margin:0 auto;
    padding:0 32px;
  }

  @media (max-width:640px){
    .wrap{ padding:0 20px; }
  }

  /* ============================= NAV ============================= */
  header.site{
    position:sticky; top:0; z-index:50;
    background:rgba(245,246,241,0.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .nav-row{
    display:flex; align-items:center; justify-content:space-between;
    height:68px;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    font-family:var(--serif); font-weight:600; font-size:19px;
    text-decoration:none; color:var(--ink);
  }
  .brand-mark{
    width:30px; height:30px; border-radius:6px;
    background:var(--teal);
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-family:var(--mono); font-size:12px; font-weight:500;
    flex:none;
  }
  nav.links{ display:flex; gap:28px; }
  nav.links a{
    font-size:14.5px; text-decoration:none; color:var(--ink-soft);
    padding:4px 2px; border-bottom:2px solid transparent;
    transition:color .15s ease, border-color .15s ease;
  }
  nav.links a:hover{ color:var(--ink); border-bottom-color:var(--line-strong); }
  .nav-cta{
    font-size:14px; font-weight:600; color:#fff !important; background:var(--teal);
    padding:9px 16px; border-radius:var(--radius-s); border-bottom:none !important;
    text-decoration:none;
  }
  .nav-cta:hover{ background:var(--teal-deep); }
  .nav-toggle{ display:none; }

  @media (max-width:860px){
    nav.links{ display:none; }
    .nav-toggle{
      display:inline-flex; align-items:center; justify-content:center;
      width:36px; height:36px; border:1px solid var(--line-strong); border-radius:var(--radius-s);
      background:none; cursor:pointer;
    }
    nav.links.open{
      display:flex; position:absolute; top:68px; left:0; right:0;
      flex-direction:column; background:var(--surface);
      border-bottom:1px solid var(--line); padding:14px 20px 20px; gap:4px;
    }
    nav.links.open a{ padding:10px 4px; border-bottom:1px solid var(--line); width:100%; }
    .nav-cta{ margin-top:8px; text-align:center; }
  }

  /* ============================= HERO ============================= */
  .hero{
    padding:76px 0 64px;
    border-bottom:1px solid var(--line);
  }
  .hero-grid{
    display:grid;
    grid-template-columns:1.05fr 0.95fr;
    gap:56px;
    align-items:center;
  }
  .hero h1{
    font-size:clamp(34px, 4.4vw, 50px);
    line-height:1.08;
    max-width:14ch;
  }
  .hero p.lede{
    margin-top:20px;
    font-size:18px;
    color:var(--ink-soft);
    max-width:46ch;
    line-height:1.6;
  }
  .hero-stats{
    display:flex; gap:32px; margin-top:36px; flex-wrap:wrap;
  }
  .stat b{
    display:block; font-family:var(--serif); font-size:28px; color:var(--teal); font-weight:600;
  }
  .stat span{
    display:block; font-size:13px; color:var(--ink-faint); margin-top:2px; max-width:16ch;
  }

  .diagram-box{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-m);
    padding:20px;
  }
  .diagram-box svg{ width:100%; height:auto; display:block; }

  .flow-line{
    stroke-dasharray:400;
    stroke-dashoffset:400;
    animation:draw 1.4s ease forwards;
  }
  .flow-line.d2{ animation-delay:.15s; }
  .flow-line.d3{ animation-delay:.3s; }
  @keyframes draw{ to{ stroke-dashoffset:0; } }
  @media (prefers-reduced-motion: reduce){
    .flow-line{ animation:none; stroke-dashoffset:0; }
  }

  @media (max-width:900px){
    .hero-grid{ grid-template-columns:1fr; }
  }

  /* ============================= SECTION SCAFFOLDING ============================= */
  section{ padding:72px 0; border-bottom:1px solid var(--line); }
  section:last-of-type{ border-bottom:none; }
  .section-head{
    display:flex; justify-content:space-between; align-items:flex-end;
    gap:24px; margin-bottom:36px; flex-wrap:wrap;
  }
  .section-head h2{ font-size:clamp(24px,3vw,32px); }
  .section-head p{ color:var(--ink-soft); max-width:56ch; margin-top:10px; }

  /* ============================= FILTER TABS ============================= */
  .filters{
    display:flex; gap:10px; flex-wrap:wrap; margin-bottom:40px;
  }
  .filter-btn{
    font-family:var(--sans); font-size:14px; font-weight:500;
    background:var(--surface); color:var(--ink-soft);
    border:1px solid var(--line-strong); border-radius:var(--radius-s);
    padding:9px 16px; cursor:pointer; transition:all .15s ease;
  }
  .filter-btn:hover{ border-color:var(--teal); color:var(--ink); }
  .filter-btn.active{ background:var(--teal); border-color:var(--teal); color:#fff; }

  /* ============================= CATEGORY OVERVIEW CARDS ============================= */
  .overview-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
    border-radius:var(--radius-m);
    overflow:hidden;
  }
  .overview-card{
    background:var(--surface);
    padding:26px 22px;
    text-decoration:none;
    color:var(--ink);
    display:flex; flex-direction:column; gap:10px;
    transition:background .15s ease;
  }
  .overview-card:hover{ background:var(--teal-tint); }
  .overview-card .n{ font-family:var(--mono); font-size:12px; color:var(--ink-faint); }
  .overview-card h3{ font-size:17px; }
  .overview-card p{ font-size:13.5px; color:var(--ink-soft); }

  @media (max-width:900px){
    .overview-grid{ grid-template-columns:repeat(2,1fr); }
  }
  @media (max-width:560px){
    .overview-grid{ grid-template-columns:1fr; }
  }

  /* ============================= INTEGRATION CARDS ============================= */
  .integration-list{ display:flex; flex-direction:column; gap:16px; }

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-m);
    padding:28px 30px;
  }
  .card-top{
    display:flex; justify-content:space-between; align-items:flex-start; gap:20px; flex-wrap:wrap;
  }
  .card-title-group{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .card h3{ font-size:20px; }
  .module-tag{
    font-family:var(--mono); font-size:11.5px; font-weight:500;
    color:var(--teal); background:var(--teal-tint);
    border:1px solid var(--teal);
    padding:3px 8px; border-radius:3px; white-space:nowrap;
  }
  .card-desc{ margin-top:12px; color:var(--ink-soft); max-width:70ch; font-size:15px; }

  .card-meta{
    display:grid;
    grid-template-columns:auto 1fr;
    gap:10px 20px;
    margin-top:22px;
    padding-top:20px;
    border-top:1px solid var(--line);
    font-size:13.5px;
  }
  .meta-label{ color:var(--ink-faint); font-weight:500; white-space:nowrap; padding-top:2px; }
  .meta-value{ color:var(--ink); }

  .flow-badge{
    display:inline-flex; align-items:center; gap:8px;
    font-family:var(--mono); font-size:13px; color:var(--ink);
  }
  .flow-badge .arrow{ color:var(--amber); font-weight:500; }

  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    font-size:13px; color:var(--ink-soft);
    background:var(--surface-alt);
    border:1px solid var(--line-strong);
    border-radius:3px; padding:3px 9px;
  }

  .datapoints{ display:flex; flex-wrap:wrap; gap:6px 10px; }
  .datapoints li{
    font-size:13px; color:var(--ink-soft);
    position:relative; padding-left:13px;
  }
  .datapoints li::before{
    content:""; position:absolute; left:0; top:8px;
    width:5px; height:5px; border-radius:50%; background:var(--amber);
  }

  .questionnaire{
    margin-top:22px;
    border-top:1px solid var(--line);
    padding-top:18px;
  }
  .questionnaire summary{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    cursor:pointer; color:var(--teal); font-weight:600; font-size:14px;
    list-style:none;
  }
  .questionnaire summary::-webkit-details-marker{ display:none; }
  .questionnaire summary::after{
    content:"+"; flex:none; font-family:var(--mono); font-size:18px; font-weight:400;
  }
  .questionnaire[open] summary::after{ content:"−"; }
  .questionnaire-list{
    display:flex; flex-direction:column; gap:0;
    margin-top:18px; border:1px solid var(--line); border-radius:var(--radius-s);
    overflow:hidden;
  }
  .questionnaire-item{
    display:grid; grid-template-columns:minmax(220px, .8fr) minmax(0, 1.2fr);
    border-top:1px solid var(--line);
  }
  .questionnaire-item:first-child{ border-top:none; }
  .questionnaire-item:nth-child(even){ background:var(--surface-alt); }
  .questionnaire-question,
  .questionnaire-answer{ padding:18px 20px; font-size:13.5px; }
  .questionnaire-question{ font-weight:600; color:var(--ink); border-right:1px solid var(--line); }
  .questionnaire-answer{ color:var(--ink-soft); }
  .questionnaire-answer p + p,
  .questionnaire-answer p + ul,
  .questionnaire-answer ul + p{ margin-top:10px; }
  .questionnaire-answer ul{ list-style:disc; padding-left:18px; }
  .questionnaire-answer code{
    font-family:var(--mono); font-size:12.5px; color:var(--teal-deep);
    overflow-wrap:anywhere;
  }
  .questionnaire-answer a{ color:var(--teal); text-underline-offset:2px; }

  @media (max-width:700px){
    .questionnaire-item{ grid-template-columns:1fr; }
    .questionnaire-question{ border-right:none; border-bottom:1px solid var(--line); padding-bottom:12px; }
    .questionnaire-answer{ padding-top:12px; }
  }

  /* ============================= GLOSSARY ============================= */
  .glossary-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
    border-radius:var(--radius-m);
    overflow:hidden;
  }
  .glossary-item{
    background:var(--surface);
    padding:20px 22px;
  }
  .glossary-item dt{
    font-family:var(--mono); font-size:13px; font-weight:500;
    color:var(--teal); margin-bottom:6px;
  }
  .glossary-item dd{ margin:0; font-size:13.5px; color:var(--ink-soft); }

  @media (max-width:760px){
    .glossary-grid{ grid-template-columns:1fr; }
  }

  /* ============================= FAQ ============================= */
  .faq-list{ display:grid; gap:12px; max-width:900px; }
  .faq-item{
    border:1px solid var(--line); border-radius:var(--radius-m);
    background:var(--surface); overflow:hidden;
  }
  .faq-item summary{
    list-style:none; cursor:pointer; padding:18px 54px 18px 22px;
    font-family:var(--serif); font-weight:600; color:var(--ink);
    position:relative;
  }
  .faq-item summary::-webkit-details-marker{ display:none; }
  .faq-item summary::after{
    content:"+"; position:absolute; right:22px; top:50%;
    transform:translateY(-50%); font:400 24px var(--sans); color:var(--teal);
  }
  .faq-item[open] summary::after{ content:"\2212"; }
  .faq-item[open] summary{ border-bottom:1px solid var(--line); }
  .faq-answer{ padding:16px 22px 20px; color:var(--ink-soft); font-size:14.5px; }

  /* ============================= CTA ============================= */
  .cta-section{
    background:var(--teal-deep);
    color:#fff;
  }
  .cta-section .section-head p{ color:#CFE0DC; }
  .cta-section h2{ color:#fff; }
  .cta-box{
    display:flex; justify-content:space-between; align-items:center;
    gap:24px; flex-wrap:wrap;
  }
  .cta-box p{ max-width:52ch; color:#DDE9E6; font-size:15.5px; }
  .btn-primary{
    display:inline-block;
    background:var(--amber); color:#221604;
    font-weight:600; font-size:15px;
    padding:13px 24px; border-radius:var(--radius-s);
    text-decoration:none; white-space:nowrap;
  }
  .btn-primary:hover{ background:#c48f3f; }

  /* ============================= FOOTER ============================= */
  footer{
    padding:40px 0;
  }
  .footer-row{
    display:flex; justify-content:space-between; align-items:center;
    flex-wrap:wrap; gap:16px;
    font-size:13px; color:var(--ink-faint);
  }
  .footer-row a{ text-decoration:none; color:var(--ink-faint); }
  .footer-row a:hover{ color:var(--ink); }
  .footer-links{ display:flex; gap:20px; flex-wrap:wrap; }

  /* ============================= SMARTFOODSAFE.COM BRAND THEME ============================= */
  :root{
    --bg:#FFFFFF; --surface:#FFFFFF; --surface-alt:#F2F5FF;
    --ink:#0B163F; --ink-soft:#54595F; --ink-faint:#727272;
    --line:#E3E7EF; --line-strong:#C9D2E3;
    --teal:#0B163F; --teal-deep:#071C4D; --teal-tint:#F2F5FF;
    --amber:#E88300; --amber-tint:#FFE8D1;
    --serif:'Poppins',sans-serif; --sans:'Plus Jakarta Sans',sans-serif;
    --mono:'Plus Jakarta Sans',sans-serif; --radius-s:6px; --radius-m:10px;
  }
  body{ background:var(--bg); }
  header.site{ background:rgba(255,255,255,.94); }
  .brand-logo{ display:block; width:220px; height:auto; }
  .hero{ background:linear-gradient(145deg,#0B163F 0%,#071C4D 100%); }
  .hero h1{ color:#fff; font-weight:700; }
  .hero p.lede{ color:#DCE5F5; }
  .hero .stat b{ color:#E88300; }
  .hero .stat span{ color:#C9D2E3; }
  .overview-card:hover{ background:#F2F5FF; }
  .filter-btn.active,.nav-cta{ background:#E88300; border-color:#E88300; color:#fff !important; }
  .filter-btn.active:hover,.nav-cta:hover{ background:#EF860C; }
  .module-tag{ color:#0B163F; background:#F2F5FF; border-color:#A8C6FF; }
  .cta-section{ background:#0B163F; }
  .btn-primary{ background:#E88300; color:#fff; }
  footer{ background:#071C4D; padding:36px 0; }
  .footer-row,.footer-row a{ color:#DCE5F5; }
  .footer-row a:hover{ color:#fff; }
  .footer-logo{ display:block; width:205px; height:auto; filter:brightness(0) invert(1); }
  .page-loader{ display:none; }
  .js .page-loader{
    position:fixed; inset:0; z-index:9999; display:grid; place-items:center;
    background:#fff; transition:opacity .2s ease,visibility .2s ease;
  }
  .js .page-loader.is-hidden{ opacity:0; visibility:hidden; pointer-events:none; }
  .page-loader img{ width:clamp(300px,42vw,520px); height:clamp(300px,42vw,520px); object-fit:contain; }

  /* ============================= RESPONSIVE POLISH ============================= */
  .hero-grid > *, .card-meta > *, .questionnaire-item > *{ min-width:0; }
  .meta-value, .flow-badge, .card-desc, .faq-answer{ overflow-wrap:anywhere; }

  @media(max-width:900px){
    .hero{ padding:60px 0 52px !important; }
    .hero-grid{ gap:38px; }
    .hero h1{ max-width:18ch; }
    .diagram-box{ max-width:620px; width:100%; margin:0 auto; }
    section{ padding:60px 0; }
    .card{ padding:24px; }
    .glossary-grid{ grid-template-columns:repeat(2,1fr); }
  }

  @media(max-width:700px){
    .wrap{ padding-left:20px; padding-right:20px; }
    .brand-logo{ width:180px; }
    nav.links.open{ max-height:calc(100vh - 68px); overflow-y:auto; box-shadow:0 14px 28px rgba(11,22,63,.12); }
    .hero{ padding:48px 0 42px !important; }
    .hero h1{ font-size:clamp(32px,9vw,42px); max-width:none; }
    .hero p.lede{ font-size:16.5px; }
    .hero-stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-top:28px; }
    .stat span{ max-width:none; }
    .diagram-box{ padding:12px; overflow:hidden; }
    section{ padding:48px 0; }
    .section-head{ margin-bottom:28px; }
    .filters{ flex-wrap:nowrap; overflow-x:auto; margin:0 -20px 30px; padding:0 20px 8px; scrollbar-width:thin; }
    .filter-btn{ flex:0 0 auto; }
    .card{ padding:22px 18px; }
    .card-top{ gap:12px; }
    .card-meta{ grid-template-columns:1fr; gap:5px; }
    .card-meta .meta-label{ margin-top:10px; }
    .card-meta .meta-label:first-child{ margin-top:0; }
    .flow-badge{ display:block; width:100%; }
    .glossary-grid{ grid-template-columns:1fr; }
    .faq-item summary{ padding:17px 48px 17px 18px; }
    .faq-item summary::after{ right:18px; }
    .faq-answer{ padding:15px 18px 18px; }
    .cta-box{ align-items:stretch; }
    .btn-primary{ width:100%; text-align:center; white-space:normal; }
    .footer-row{ flex-direction:column; align-items:flex-start; }
    .footer-logo{ width:175px; }
    .footer-links{ width:100%; justify-content:space-between; }
  }

  @media(max-width:480px){
    .wrap{ padding-left:16px; padding-right:16px; }
    .brand-logo{ width:156px; }
    .nav-toggle{ flex:none; }
    nav.links.open{ padding-left:16px; padding-right:16px; }
    .hero{ padding:40px 0 36px !important; }
    .hero-stats{ grid-template-columns:1fr; gap:14px; }
    .stat{ display:grid; grid-template-columns:52px 1fr; align-items:center; gap:10px; }
    .stat b{ font-size:25px; }
    .diagram-box{ margin-left:-4px; width:calc(100% + 8px); }
    section{ padding:42px 0; }
    .overview-card{ padding:22px 18px; }
    .filters{ margin-left:-16px; margin-right:-16px; padding-left:16px; padding-right:16px; }
    .card-title-group{ align-items:flex-start; }
    .questionnaire-question,.questionnaire-answer{ padding-left:14px; padding-right:14px; }
    .page-loader img{ width:300px; height:300px; }
  }
</style>
</head>
<body data-page="integrations">
<div id="page-root"></div>
<script src="content-renderer.js"></script>
</body>
</html>
