<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trust &amp; Security — Smart Food Safe</title>
<meta name="description" content="How Smart Food Safe protects your data: certifications, security architecture, privacy, and reliability at a glance.">
<link rel="icon" href="https://cdn.smartfoodsafe.com/platform/favicon.ico" sizes="any">
<script>document.documentElement.classList.add('js');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{
  --navy:#003675; --navy-dk:#022B5C; --navy-deep:#0F134E;
  --mint:#B5FEBC; --mint-soft:#E4FFE7;
  --ink:#16171F; --grey:#67697C; --line:#E3E5EC; --paper:#FFFFFF; --wash:#F6F8FB;
  --maxw:1120px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Manrope',system-ui,sans-serif;color:var(--ink);background:var(--paper);line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;letter-spacing:-.02em;line-height:1.1}
a{color:inherit}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}

/* ---- top bar ---- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;height:68px}
.topbar img{height:22px;display:block}
.navlinks{display:flex;gap:28px;font-size:14px;font-weight:600;color:var(--grey)}
.navlinks a{text-decoration:none;transition:color .15s}
.navlinks a:hover{color:var(--navy)}
@media(max-width:720px){.navlinks{display:none}}

/* ---- hero ---- */
.hero{background:linear-gradient(160deg,var(--navy) 0%,var(--navy-deep) 100%);color:#fff;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-160px;top:-160px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(181,254,188,.18),transparent 62%)}
.hero .wrap{padding:96px 24px 88px;position:relative;z-index:2}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-family:'Space Grotesk';font-weight:600;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--mint);margin-bottom:22px}
.eyebrow::before{content:"";width:26px;height:2px;background:var(--mint)}
.hero h1{font-size:clamp(34px,5.4vw,60px);font-weight:700;max-width:16ch;margin-bottom:22px}
.hero p{font-size:clamp(17px,2vw,20px);max-width:60ch;color:#D7E0EC}
.hero .cta{display:flex;gap:14px;flex-wrap:wrap;margin-top:36px}
.btn{display:inline-block;font-weight:600;font-size:15px;padding:13px 26px;border-radius:10px;text-decoration:none;transition:transform .12s,background .15s}
.btn:hover{transform:translateY(-2px)}
.btn-mint{background:var(--mint);color:var(--navy-dk)}
.btn-ghost{border:1.5px solid rgba(255,255,255,.4);color:#fff}
.btn-ghost:hover{background:rgba(255,255,255,.1)}

/* ---- trust strip ---- */
.strip{background:var(--navy-dk);color:#fff}
.strip .wrap{display:flex;flex-wrap:wrap;gap:14px 44px;padding:22px 24px;align-items:center;justify-content:center}
.strip span{font-family:'Space Grotesk';font-weight:600;font-size:14px;letter-spacing:.03em;display:flex;align-items:center;gap:10px;color:#EAF0F7}
.strip span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--mint)}

/* ---- section scaffolding ---- */
section{padding:78px 0}
.sec-head{max-width:64ch;margin-bottom:44px}
.kicker{font-family:'Space Grotesk';font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--navy);margin-bottom:14px}
.sec-head h2{font-size:clamp(26px,3.4vw,38px);font-weight:700;color:var(--navy-dk);margin-bottom:14px}
.sec-head p{color:var(--grey);font-size:17px}

/* ---- pillar grid ---- */
.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
@media(max-width:900px){.pillars{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.pillars{grid-template-columns:1fr}}
.pillar{border:1px solid var(--line);border-radius:16px;padding:28px;background:var(--paper);transition:border-color .18s,box-shadow .18s,transform .18s}
.pillar:hover{border-color:var(--navy);box-shadow:0 14px 40px -22px rgba(0,54,117,.4);transform:translateY(-3px)}
.pillar .ic{width:44px;height:44px;border-radius:11px;background:var(--mint-soft);display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.pillar .ic svg{width:22px;height:22px;stroke:var(--navy);fill:none;stroke-width:1.8}
.pillar h3{font-size:19px;color:var(--navy-dk);margin-bottom:9px}
.pillar p{font-size:14.5px;color:var(--grey)}

/* ---- detail band ---- */
.band{background:var(--wash)}
.detail{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:760px){.detail{grid-template-columns:1fr}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.card h3{font-size:16px;font-family:'Space Grotesk';padding:18px 24px;background:var(--navy);color:#fff;font-weight:600;display:flex;align-items:center;gap:10px}
.card h3::before{content:"";width:9px;height:9px;background:var(--mint);border-radius:2px;flex:none}
.card dl{padding:8px 24px 20px}
.card dt{font-weight:700;font-size:14px;color:var(--navy-dk);margin-top:16px}
.card dd{font-size:14.5px;color:var(--grey);margin-top:3px}

/* ---- specs table ---- */
.specs{border:1px solid var(--line);border-radius:16px;overflow:hidden}
.specs .row{display:grid;grid-template-columns:280px 1fr;border-top:1px solid var(--line)}
.specs .row:first-child{border-top:none}
.specs .row:nth-child(even){background:var(--wash)}
.specs .k{padding:16px 24px;font-weight:700;font-size:14.5px;color:var(--navy-dk);border-right:1px solid var(--line)}
.specs .v{padding:16px 24px;font-size:14.5px;color:var(--grey)}
@media(max-width:640px){.specs .row{grid-template-columns:1fr}.specs .k{border-right:none;border-bottom:1px solid var(--line);padding-bottom:8px}}

/* ---- FAQ ---- */
.faq-groups{display:grid;gap:36px}
.faq-group h3{font-size:21px;color:var(--navy-dk);margin-bottom:14px}
.faq-list{display:grid;gap:12px}
.faq-item{border:1px solid var(--line);border-radius:14px;background:var(--paper);overflow:hidden}
.faq-item summary{list-style:none;cursor:pointer;padding:19px 54px 19px 22px;font-family:'Space Grotesk';font-weight:600;color:var(--navy-dk);position:relative}
.faq-item summary::-webkit-details-marker{display:none}
.faq-item summary::after{content:"+";position:absolute;right:22px;top:50%;transform:translateY(-50%);font-size:24px;font-weight:400;color:var(--navy)}
.faq-item[open] summary::after{content:"\2212"}
.faq-item[open] summary{border-bottom:1px solid var(--line)}
.faq-answer{padding:17px 22px 20px;color:var(--grey);font-size:14.5px}
.faq-answer p+p{margin-top:10px}

/* ---- CTA ---- */
.contact{background:linear-gradient(160deg,var(--navy) 0%,var(--navy-deep) 100%);color:#fff;text-align:center;position:relative;overflow:hidden}
.contact::before{content:"";position:absolute;left:-140px;bottom:-160px;width:460px;height:460px;border-radius:50%;background:radial-gradient(circle,rgba(181,254,188,.16),transparent 62%)}
.contact .wrap{position:relative;z-index:2}
.contact h2{font-size:clamp(26px,3.6vw,40px);font-weight:700;margin-bottom:16px}
.contact p{color:#D7E0EC;max-width:52ch;margin:0 auto 30px;font-size:17px}
.mail{display:inline-block;font-family:'Space Grotesk';font-weight:600;font-size:18px;color:var(--mint);text-decoration:none;border-bottom:2px solid transparent;transition:border-color .15s}
.mail:hover{border-color:var(--mint)}

/* ---- footer ---- */
footer{background:var(--ink);color:#9AA0AD;font-size:13px}
footer .wrap{padding:34px 24px;display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center}
footer img{height:18px;opacity:.9}
footer .meta{display:flex;gap:22px;flex-wrap:wrap}

@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.js .reveal{opacity:0;transform:translateY(16px);transition:opacity .6s ease,transform .6s ease}
.js .reveal.in{opacity:1;transform:none}

/* ---- smartfoodsafe.com brand system ---- */
:root{
  --navy:#0B163F; --navy-dk:#071C4D; --navy-deep:#0B163F;
  --mint:#E88300; --mint-soft:#FFE8D1;
  --ink:#0B163F; --grey:#54595F; --line:#E3E7EF;
  --paper:#FFFFFF; --wash:#F2F5FF; --maxw:1140px;
}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#FFFFFF}
h1,h2,h3,.display{font-family:'Poppins',sans-serif;letter-spacing:-.02em}
.wrap{padding-left:32px;padding-right:32px}
.topbar{background:rgba(255,255,255,.94);backdrop-filter:blur(8px)}
.topbar .wrap{height:68px;position:relative}
.topbar img{display:none}
.topbar .wrap::before{
  content:"";display:block;width:220px;height:28px;
  background:url('https://cdn.smartfoodsafe.com/platform/logo-full.svg') left center/contain no-repeat;
}
.topbar .wrap::after{display:none}
.navlinks{font-weight:400;color:var(--grey)}
.navlinks a{padding:4px 2px;border-bottom:2px solid transparent}
.navlinks a:hover{color:var(--navy);border-bottom-color:#E88300}
.hero{background:var(--navy-deep)}
.hero .wrap{padding-top:76px;padding-bottom:72px}
.eyebrow{font-family:'Plus Jakarta Sans',sans-serif;color:#E88300}
.eyebrow::before{background:#E88300}
.hero h1{font-weight:700}
.btn{border-radius:6px}
.btn-mint{background:#E88300;color:#fff}
.strip{background:#071C4D}
.strip span{font-family:'Plus Jakarta Sans',sans-serif}
.strip span::before{background:#E88300}
section{padding:72px 0;border-bottom:1px solid var(--line)}
.kicker{font-family:'Plus Jakarta Sans',sans-serif;color:#E88300}
.sec-head h2{font-weight:600;color:var(--ink)}
.pillar,.card,.specs,.faq-item{border-radius:10px}
.pillar h3,.card h3,.faq-group h3,.faq-item summary{font-family:'Poppins',sans-serif;color:var(--ink)}
.pillar .ic{border-radius:6px}
.card h3{background:var(--navy);color:#fff}
.faq-item summary{font-weight:600}
.faq-item summary::after{color:var(--navy)}
.contact{background:var(--navy-deep)}
.mail{font-family:'Plus Jakarta Sans',sans-serif;color:#E88300}
footer{background:#071C4D;color:#DCE5F5;border-top:1px solid #162A5B}
footer .wrap{padding:40px 32px}
footer img{display:none}
footer .wrap::before{
  content:"";display:block;width:205px;height:24px;
  background:url('https://cdn.smartfoodsafe.com/platform/logo-full.svg') left center/contain no-repeat;
  filter:brightness(0) invert(1);
}
.page-loader{display:none}
.js .page-loader{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#fff;transition:opacity .2s ease,visibility .2s ease}
.js .page-loader.is-hidden{opacity:0;visibility:hidden;pointer-events:none}
.page-loader img{display:block;width:clamp(300px,42vw,520px);height:clamp(300px,42vw,520px);object-fit:contain;filter:none}
@media(max-width:640px){.wrap{padding-left:20px;padding-right:20px}.topbar .wrap::before{width:180px}.hero .wrap,footer .wrap{padding-left:20px;padding-right:20px}}
</style>
</head>
<body data-page="security">
<div id="page-root"></div>
<script src="content-renderer.js"></script>
</body>
</html>
